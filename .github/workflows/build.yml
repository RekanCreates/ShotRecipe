name: Build ShotRecipe APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ShotRecipe source
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q ShotRecipe_v2_source.zip -d build_src
          test -f build_src/ShotRecipe_v2/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: build_src/ShotRecipe_v2
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shotrecipe-debug-apk
          path: build_src/ShotRecipe_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
